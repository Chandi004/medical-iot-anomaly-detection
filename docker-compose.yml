services:

  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16
    container_name: medical-postgres

    environment:
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_pass
      POSTGRES_DB: medical_iot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_user -d medical_iot"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # Kafka
  # ==========================================
  kafka:
    image: apache/kafka:4.1.2
    container_name: medical-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1


  # ==========================================
  # Sensor Producer
  # ==========================================
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer

    container_name: medical-producer

    depends_on:
      kafka:
        condition: service_started

    restart: unless-stopped


  # ==========================================
  # Spark Streaming
  # ==========================================
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: medical-spark

    depends_on:
      kafka:
        condition: service_started

      postgres:
        condition: service_healthy

    volumes:
    - spark_checkpoints:/opt/spark/checkpoints

    restart: unless-stopped


  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: medical-backend

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================
  # React Frontend
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: medical-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped


# ==========================================
# Persistent PostgreSQL volume
# ==========================================

volumes:
  postgres_data:
  spark_checkpoints: